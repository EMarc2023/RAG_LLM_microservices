name: Python CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. Install dependencies

    - name: Install dependencies (CPU-Only PyTorch Fix)
      run: |
        pip install --upgrade pip
        # CRITICAL FIX: Use a single installation command and include the CPU index URL.
        # This tells pip to look at the PyTorch CPU index IN ADDITION to the main PyPI index.
        pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

    # 2. Run Linting & Formatting Checks
    - name: Run Black & Flake8 checks
      run: |
        pip install black flake8
        black --check .
        flake8 .

    # 3. Run Pytest
    - name: Run Pytest
      run: |
        # Create a placeholder .env file for the pipeline to run the tests
        echo "API_KEY=SECRET_TEST_KEY_123" >> .env
        echo "OTEL_SERVICE_NAME=CI-Test-RAG" >> .env
        pytest -v
        
  docker-artifact:
    needs: build  # This job runs only if the 'build' (test) job succeeds
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🚨 NEW CRITICAL STEP: Free up disk space before Docker operations
      - name: Aggressive Runner Disk Cleanup
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove large, unneeded pre-installed software
          sudo rm -rf /usr/share/dotnet # .NET SDKs (~2 GB)
          sudo rm -rf /usr/local/lib/android # Android SDKs (~9 GB)
          sudo rm -rf /opt/hostedtoolcache # Cached tools (e.g., Node, Go, Python) (~8 GB)
          sudo rm -rf /usr/share/swift # Swift toolchain
          sudo rm -rf /opt/ghc # Haskell GHC
          
          echo "Disk space after cleanup:"
          df -h
          
      # 1. Build the image locally (Previous step 1)
      - name: Build Docker image
        run: |
          docker build -t rag-api:v1 .

      # 2. Save the image to a tar file (Previous step 2)
      - name: Save Docker image to tar
        run: |
          docker save -o rag-api-v1.tar rag-api:v1
      
      # 3. Upload the tar file as a GitHub Artifact (Previous step 3)
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-api-v1-docker-image
          path: rag-api-v1.tar
          retention-days: 7
