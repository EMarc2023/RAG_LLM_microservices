name: Python CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. Install dependencies

    - name: Install dependencies (CPU-Only PyTorch Fix)
      run: |
        pip install --upgrade pip
        # CRITICAL FIX: Use a single installation command and include the CPU index URL.
        # This tells pip to look at the PyTorch CPU index IN ADDITION to the main PyPI index.
        pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

    # 2. Run Linting & Formatting Checks
    - name: Run Black & Flake8 checks
      run: |
        pip install black flake8
        black --check .
        flake8 .

    # 3. Run Pytest
    - name: Run Pytest
      run: |
        # Create a placeholder .env file for the pipeline to run the tests
        echo "API_KEY=SECRET_TEST_KEY_123" >> .env
        echo "OTEL_SERVICE_NAME=CI-Test-RAG" >> .env
        pytest -v
        
  docker-artifact:
    needs: build  # This job runs only if the 'build' (test) job succeeds
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Build the image locally
      - name: Build Docker image
        # This uses the standard Docker CLI commands available on the runner
        run: |
          docker build -t rag-api:v1 .

      # 2. Save the image to a tar file (the artifact)
      - name: Save Docker image to tar
        # The docker save command exports the image to a single file
        run: |
          docker save -o rag-api-v1.tar rag-api:v1
      
      # 3. Upload the tar file as a GitHub Artifact
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-api-v1-docker-image
          path: rag-api-v1.tar
          retention-days: 30 # Optional: Sets how long the artifact is retained
