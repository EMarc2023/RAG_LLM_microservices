name: Python CI (v2 Branch)

on:
  push:
    branches: [ "v2" ]  # Only trigger when you push to v2
  pull_request:
    branches: [ "v2" ]  # Only trigger for PRs targeting v2

jobs:
  Run-tests:
    runs-on: ubuntu-latest

    services:
      # Optional: You can spin up Jaeger here too if your tests need it
      jaeger:
        image: jaegertracing/all-in-one:1.51
        ports:
          - 4317:4317

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install torch CPU version to save time/space in CI
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio respx

    - name: Run Unit Tests
      env:
        API_KEY: ${{ secrets.API_KEY }} # Uses GitHub Secrets for safety
        RAG_SERVICE_URL: http://localhost:8000
        LLM_SERVICE_URL: http://localhost:8001
      run: |
        pytest -v

  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install Linting Tools
        run: pip install black flake8

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all formatting warnings as warnings (non-blocking)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

  docker-cd:
    name: Docker Build & Archive
    needs: Run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t simple-rag-orchestrator:v2-${{ github.sha }} .

      - name: Save Image as Tar
        run: docker save simple-rag-orchestrator:v2-${{ github.sha }} > orchestrator-v2.tar

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-docker-image
          path: orchestrator-v2.tar
          retention-days: 5